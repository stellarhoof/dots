# Install homebrew first and use normally. Following are some useful commands:
# - brew uninstall <formula_name>
# - brew autoremove
[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew-cask:balenaetcher" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:brave-browser" = "latest"
"brew-cask:calibre" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew-cask:handbrake-app" = "latest"
"brew-cask:kitty" = "latest"
"brew-cask:nordvpn" = "latest"
"brew-cask:pritunl" = "latest"
"brew-cask:redis-insight" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:studio-3t" = "latest"
"brew-cask:transmission" = "latest"
"brew-cask:ungoogled-chromium" = "latest"
"brew:ast-grep" = "latest"
"brew:bfg" = "latest"
"brew:coreutils" = "latest"
"brew:diffutils" = "latest"
"brew:dua-cli" = "latest"
"brew:duf" = "latest"
"brew:emmylua_ls" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:findutils" = "latest"
"brew:fish" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-get" = "latest"
"brew:git-lfs" = "latest"
"brew:gnu-sed" = "latest"
"brew:gnupg" = "latest"
"brew:grep" = "latest"
"brew:htop" = "latest"
"brew:hub" = "latest"
"brew:jq" = "latest"
"brew:less" = "latest"
"brew:neovim" = "latest"
"brew:openssh" = "latest"
"brew:pass" = "latest"
"brew:pass-otp" = "latest"
"brew:pinentry-mac" = "latest"
"brew:qrencode" = "latest"
"brew:ripgrep" = "latest"
"brew:sevenzip" = "latest"
"brew:shfmt" = "latest"
"brew:starship" = "latest"
"brew:tailwindcss-language-server" = "latest"
"brew:tokei" = "latest"
"brew:trash-cli" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:unzip" = "latest"
"brew:wget" = "latest"
"brew:worktrunk" = "latest"
"brew:yt-dlp" = "latest"
"brew:zoxide" = "latest"

[settings]
dotfiles.default_mode = "symlink-each"

[dotfiles]
"~/.gnupg" = { source = ".gnupg" }
"~/.local/bin" = { source = ".local/bin" }
"~/.config/gh" = { source = ".config/gh" }
"~/.config/git" = { source = ".config/git" }
"~/.config/npm" = { source = ".config/npm" }
"~/.config/kitty" = { source = ".config/kitty" }
"~/.config/fish" = { source = ".config/fish" }
"~/.config/mise" = { source = ".config/mise" }
"~/.config/ripgrep" = { source = ".config/ripgrep" }
"~/.config/nvim" = { source = ".config/nvim", mode = "symlink" }
"~/.config/starship.toml" = { source = ".config/starship.toml", mode = "symlink" }

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[bootstrap.macos.launchd.agents.mise-session-env]
program = "~/.local/bin/test.sh"
run_at_load = true
