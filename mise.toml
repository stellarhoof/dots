[tools]
claude-code = "latest"
node = "latest"
"npm:@vtsls/language-server" = "latest"
pi = "latest"
pnpm = "latest"
python = "latest"
rust = "latest"
yarn = "latest"

[settings]
dotfiles.root = "~/Projects/github.com/stellarhoof/dots"

[dotfiles]
"~/.config/alacritty" = {}
"~/.config/fish/config.fish" = {}
"~/.config/gh" = {}
"~/.config/git" = {}
"~/.config/kitty" = {}
"~/.config/nvim" = {}
"~/.config/ripgrep" = {}
"~/.config/starship.toml" = {}
"~/.local/state/gnupg/gpg-agent.conf" = {}

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"
