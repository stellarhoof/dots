[brightness]
enable_ddcutil = true

[audio]
enable_sounds = true

[shell]
# A polkit agent is a process responsible for authenticating the current user
# when a graphical application requests elevated privileges through the Polkit
# authorization framework.
polkit_agent = true
app_icon_colorize = true
app_icon_color = "primary"

[widget.clock]
format = "%a | %I:%M %p"

[shell.animation]
speed = 3.0

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 200.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 400.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 600.0

[wallpaper]
directory = "/home/ah/Pictures/Wallpapers"

[theme]
community_palette = "Espresso Cream"
wallpaper_scheme = "faithful"

[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[theme.templates.user.niri]
input_path = "./niri/matugen.kdl"
output_path = "~/.config/niri/matugen.kdl"

[theme.templates.user.foot]
input_path = "./foot/matugen.ini"
output_path = "~/.config/foot/matugen.ini"

[theme.templates.user.nvim]
input_path = "./nvim/matugen.lua"
output_path = "~/.config/nvim/colors/matugen.lua"
post_hook = 'pkill -SIGUSR1 nvim || true'

[theme.templates.user.brave]
input_path = "./brave/classic-theme.json"
output_path = "/etc/brave/policies/managed/classic-theme.json"
post_hook = "brave --refresh-platform-policy --no-startup-window"

[theme.templates.user.terminal-sequences]
input_path = "./terminal-sequences"
output_path = "~/.cache/terminal-sequences"
post_hook = "tee /dev/pts/[0-9]* < ~/.cache/terminal-sequences"
