[settings]
dotfiles.default_mode = "symlink-each"

[bootstrap.hooks.post-packages]
# tailwindcss-language-server
# worktrunk
run = '''
sudo xbps-install --yes \
  7zip \
  ast-grep \
  dua-cli \
  duf \
  fish-shell \
  curl \
  git \
  github-cli \
  delta \
  git-filter-repo \
  git-lfs \
  htop \
  hub \
  moor \
  pass \
  pass-otp \
  gopass \
  qrencode \
  shfmt \
  tokei \
  trash-cli \
  font-firacode \
  wget \
  eza \
  starship \
  zoxide \
  fzf \
  fd \
  foot \
  ripgrep \
  niri \
  wl-clipboard \
  xtools \
  psmisc \
  brave-browser \
  fwupd \
  ddcutil \
  pipewire \
  upower \
  powertop \
  power-profiles-daemon \
  socklog-void \
  libatomic \
  framework-system \
  noctalia \
  noctalia-greeter \
  noto-fonts-ttf \
  noto-fonts-emoji \
  nerd-fonts-symbols-ttf \
  mpv \
  mesa \
  mesa-vaapi \
  qt5-wayland \
  yt-dlp \
  xdg-desktop-portal \
  xdg-desktop-portal-gtk \
  hyprcursor \
  bind-utils \
  elogind \
  greetd
'''

[bootstrap.files."/etc/greetd/config.toml"]
owner = "root"
group = "root"
mode = "644"
content = '''
[terminal]
# The VT to run the greeter on.
vt = 7

# The default session, also known as the greeter.
[default_session]
command = "tuigreet"

# The user to run the command as. The privileges this user must have depends
# on the greeter. A graphical greeter may for example require the user to be
# in the `video` group.
user = "_greeter"
'''

# Dependency of ddcutil
[bootstrap.files."/etc/modules-load.d/i2c-dev.conf"]
owner = "root"
group = "root"
mode = "644"
content = "i2c-dev"

[bootstrap.directories."/usr/local/share/wayland-sessions"]
owner = "root"
group = "root"
mode = "755"

# Start niri wrapped in dbus-run-session since we don't use systemd
[bootstrap.files."/usr/local/share/wayland-sessions/niri.desktop"]
owner = "root"
group = "root"
mode = "644"
content = '''
[Desktop Entry]
Name=Niri (with dbus)
Type=Application
DesktopNames=niri
Exec=dbus-run-session niri --session
'''

# https://www.januschka.com/chromium-omarchy.html
[bootstrap.directories."/etc/brave"]
owner = "ah"
group = "ah"
mode = "755"

# https://www.januschka.com/chromium-omarchy.html
[bootstrap.directories."/etc/brave/policies"]
owner = "ah"
group = "ah"
mode = "755"

# https://www.januschka.com/chromium-omarchy.html
[bootstrap.directories."/etc/brave/policies/managed"]
owner = "ah"
group = "ah"
mode = "755"

