[bootstrap.files."/etc/greetd/config.toml"]
owner = "root"
group = "root"
mode = "644"
content = '''
[terminal]
# The VT to run the greeter on.
vt = 7

# The default session, also known as the greeter.
[default_session]
command = "/usr/sbin/noctalia-greeter-session"

# The user to run the command as. The privileges this user must have depends
# on the greeter. A graphical greeter may for example require the user to be
# in the `video` group.
user = "ah"
'''

# Dependency of ddcutil
[bootstrap.files."/etc/modules-load.d/i2c-dev.conf"]
owner = "root"
group = "root"
mode = "644"
content = "i2c-dev"

[bootstrap.directories."/usr/local/share/wayland-sessions"]
owner = "root"
group = "root"
mode = "755"

# Start niri wrapped in dbus-run-session since we don't use systemd
[bootstrap.files."/usr/local/share/wayland-sessions/niri.desktop"]
owner = "root"
group = "root"
mode = "644"
content = '''
[Desktop Entry]
Name=Niri
Type=Application
DesktopNames=niri
Exec=dbus-run-session niri --session
'''

# https://www.januschka.com/chromium-omarchy.html
[bootstrap.directories."/etc/brave/policies/managed"]
owner = "ah"
group = "ah"
mode = "755"

[dotfiles]
"~/.config/foot" = { source = "./.config/foot" }
"~/.config/niri" = { source = "./.config/niri" }
"~/.config/noctalia" = { source = "./.config/noctalia" }

[bootstrap.user]
login_shell = "/usr/bin/fish"
