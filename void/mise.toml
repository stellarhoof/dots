[settings]
dotfiles.default_mode = "symlink-each"

[env]
TERMINAL = "foot"
SSH_AUTH_SOCK = "$XDG_RUNTIME_DIR/ssh-agent.socket"

[bootstrap.hooks.post-packages]
# tailwindcss-language-server 
# worktrunk
# Remove lightdm, and sddm
run = '''
sudo xbps-install --yes \
  7zip \
  ast-grep \
  dua-cli \
  duf \
  fish-shell \
  git \
  delta \
  git-filter-repo \
  git-lfs \
  htop \
  hub \
  moor \
  pass \
  pass-otp \
  qrencode \
  shfmt \
  tokei \
  trash-cli \
  font-firacode \
  wget \
  eza \
  starship \
  zoxide \
  fzf \
  fd \
  foot \
  ripgrep \
  niri \
  wl-clipboard \
  xtools \
  psmisc \
  brave-browser \
  brightnessctl \
  fwupd \
  upower

# Services
sudo xbps-install --yes \
  greetd \
  elogind
'''

[bootstrap.files."/etc/greetd/config.toml"]
owner = "root"
group = "root"
mode = "644"
source = "./etc/greetd/config.toml"

[dotfiles]
"~/.config/foot" = { source = "./.config/foot" }
"~/.config/niri" = { source = "./.config/niri" }

[bootstrap.user]
login_shell = "/usr/bin/fish"
