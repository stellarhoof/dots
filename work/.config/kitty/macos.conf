# Fonts

font_family postscript_name=FiraCode-Regular
bold_font postscript_name=FiraCode-Bold
italic_font postscript_name=FiraCode-Regular
bold_italic_font postscript_name=FiraCode-Bold
modify_font cell_width -1px
# font_size 14
# modify_font cell_height 15px
font_size 15
modify_font cell_height 16px

# Colors

foreground #2C363C
background #E8E4E3
selection_foreground #2C363C
selection_background #CBD9E3
cursor #2C363C
cursor_text_color #F0EDEC
active_tab_foreground #2C363C
active_tab_background #DEB9D6
inactive_tab_foreground #2C363C
inactive_tab_background #D6CDC9
color0 #F0EDEC black
color8 #CFC1BA
color1 #A8334C red
color9 #94253E
color2  #4F6C31 green
color10 #3F5A22
color3  #944927 yellow
color11 #803D1C
color4  #286486 blue
color12 #1D5573
color5  #88507D magenta
color13 #7B3B70
color6  #3B8992 cyan
color14 #2B747C
color7  #2C363C white
color15 #4F5E68

# Appearance
hide_window_decorations no
macos_titlebar_color background
macos_colorspace default

# Keybinds
map kitty_mod+f toggle_maximized
