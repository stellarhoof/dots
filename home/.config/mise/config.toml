[tools]
"npm:@vtsls/language-server" = "latest"
claude-code = "latest"
go = "latest"
node = "latest"
pi = "latest"
pnpm = "latest"
python = "latest"
rust = "latest"
yarn = "latest"

[shell_alias]
cc = "SHELL=/bin/bash command claude"
cp = "cp -i"
df = "duf"
diff = "diff --color=auto"
du = "dua"
eza = "eza --icons --group-directories-first"
g = "git"
l = "eza -la"
la = "eza -a"
less = "less -R"
ll = "eza -l"
lla = "eza -la"
ls = "eza"
lt = "eza --tree"
p = "pnpm"
tp = "trash-put"
vi = "nvim"
y = "yarn"
# rm = 'echo '\''Use `trash-put` instead!'\'' false'

[env]
# Default programs
EDITOR = "nvim"
VISUAL = "nvim"
PAGER = "less -R"
MANPAGER = "less -s -M"
# Home declutter
CARGO_HOME = "$XDG_DATA_HOME/cargo"
GOMODCACHE = "$XDG_CACHE_HOME/go/mod"
GOPATH = "$XDG_DATA_HOME/go"
NODE_REPL_HISTORY = "$XDG_STATE_HOME/node_repl_history"
NPM_CONFIG_USERCONFIG = "$XDG_CONFIG_HOME/npm/npmrc.user"
NPM_CONFIG_GLOBALCONFIG = "$XDG_CONFIG_HOME/npm/npmrc"
PYTHONPYCACHEPREFIX = "$XDG_CACHE_HOME/python"
PYTHON_EGG_CACHE = "$XDG_CACHE_HOME/python-eggs"
PYTHON_HISTORY = "$XDG_STATE_HOME/python_history"
RUSTUP_HOME = "$XDG_DATA_HOME/rustup"
ICEAUTHORITY = "$XDG_CACHE_HOME/ICEauthority"
INPUTRC = "$XDG_CONFIG_HOME/readline/inputrc"
MYSQL_HISTFILE = "$XDG_STATE_HOME/mysql_history"
REDISCLI_HISTFILE = "$XDG_STATE_HOME/redis/rediscli_history"
REDISCLI_RCFILE = "$XDG_CONFIG_HOME/redis/redisclirc"
RIPGREP_CONFIG_PATH = "$XDG_CONFIG_HOME/ripgrep/ripgreprc"
SQLITE_HISTORY = "$XDG_STATE_HOME/sqlite_history"
GROFF_NO_SGR = 1
EXA_ICON_SPACING = 2
PASSWORD_STORE_DIR = "$XDG_PROJECTS_HOME/github.com/stellarhoof/pass"
