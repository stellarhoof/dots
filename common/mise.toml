[settings]
dotfiles.default_mode = "symlink-each"

[bootstrap.repos]
"~/Projects/github.com/stellarhoof/nvim" = { url = "https://github.com/stellarhoof/nvim.git" }
"~/Projects/github.com/stellarhoof/pass" = { url = "https://github.com/stellarhoof/pass.git" }

[dotfiles]
"~/.ssh" = { source = "./.ssh" }
"~/.gnupg" = { source = "./.gnupg" }
"~/.config" = { source = "./.config" }
"~/.config/nvim" = { source = "~/Projects/github.com/stellarhoof/nvim", mode = "symlink" }
